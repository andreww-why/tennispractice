<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Practice Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c1520;
      --surface: #131f2e;
      --surface2: #1b2d42;
      --surface3: #243854;
      --court: #1e6b35;
      --court2: #144726;
      --accent: #f9d342;
      --text: #dce8f5;
      --muted: #6a87a6;
      --gold: #ffc107;
      --orange: #e65100;
      --sidebar-w: 290px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--court2) 0%, var(--court) 55%, #43a047 100%);
      padding: 12px 20px;
      border-bottom: 3px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .header-logo { font-size: 1.5rem; line-height: 1; }
    .header h1   { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: 0.3px; }
    .header p    { font-size: 0.75rem; color: rgba(255,255,255,0.65); margin-top: 1px; }

    /* ── App body: sidebar + main ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--surface2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-inner {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Scrollbar styling */
    .sidebar-inner::-webkit-scrollbar,
    .main-content::-webkit-scrollbar { width: 5px; }
    .sidebar-inner::-webkit-scrollbar-track,
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-inner::-webkit-scrollbar-thumb,
    .main-content::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .count-pill {
      background: var(--accent);
      color: #1a1a1a;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 20px;
      margin-left: 5px;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 11px;
      background: var(--bg);
      border: 1.5px solid var(--surface2);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); font-size: 0.82rem; }

    /* ── Pre-lock section ── */
    .prelock-section {
      background: var(--bg);
      border: 1px solid var(--surface2);
      border-radius: 10px;
      overflow: hidden;
    }

    .prelock-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      background: var(--surface2);
      cursor: pointer;
      user-select: none;
    }
    .prelock-header:hover { background: var(--surface3); }

    .prelock-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      flex: 1;
    }
    .prelock-badge {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .prelock-chevron {
      font-size: 0.65rem;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .prelock-chevron.open { transform: rotate(180deg); }

    .prelock-body { padding: 11px; }

    .pool-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .player-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 28px;
    }

    .pool-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px 4px 5px;
      border: 1.5px solid var(--surface2);
      border-radius: 20px;
      background: var(--surface2);
      cursor: pointer;
      font-size: 0.77rem;
      font-weight: 600;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .pool-chip:hover  { border-color: var(--accent); background: var(--surface3); }
    .pool-chip.selected { border-color: var(--accent); background: rgba(249,211,66,0.12); color: var(--accent); }
    .pool-chip .chip-av {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }

    .pool-empty { font-size: 0.75rem; color: var(--muted); font-style: italic; }

    .pending-prompt {
      margin-top: 8px;
      padding: 7px 10px;
      background: rgba(249,211,66,0.07);
      border: 1px dashed rgba(249,211,66,0.4);
      border-radius: 7px;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .locked-pairs { margin-top: 10px; border-top: 1px solid var(--surface2); padding-top: 9px; }

    .locked-pair-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .pair-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px 3px 5px;
      border-radius: 20px;
      background: rgba(255,193,7,0.1);
      border: 1.5px solid var(--gold);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
    }
    .pair-chip .chip-av {
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .pair-link  { font-size: 0.7rem; color: var(--gold); }
    .remove-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--surface2);
      border-radius: 5px;
      color: var(--muted);
      font-size: 0.68rem;
      padding: 2px 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .remove-btn:hover { border-color: #e57373; color: #e57373; }

    /* ── Sidebar action buttons ── */
    .sidebar-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: auto;
      padding-top: 4px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      width: 100%;
      text-align: center;
    }
    .btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #1a1a1a; }
    .btn-ghost   { background: var(--surface2); color: var(--text); }
    .btn-ghost:hover { background: var(--surface3); opacity: 1; }

    /* ── Main content area ── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 14px;
      align-content: start;
    }

    /* ── Round column ── */
    .round-col {}

    .round-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 9px 13px;
      background: var(--surface);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }
    .round-title { font-size: 1rem; font-weight: 800; color: var(--accent); }
    .round-meta  { font-size: 0.7rem; color: var(--muted); margin-left: 5px; font-weight: 400; }

    .btn-sm {
      padding: 5px 11px;
      font-size: 0.73rem;
      border-radius: 7px;
      background: var(--surface2);
      color: var(--text);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-sm:hover { background: var(--surface3); }

    /* ── Court card ── */
    .court-card {
      background: var(--surface);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      border: 1px solid var(--surface2);
    }
    .court-card.remainder { border-color: #bf360c; }
    .court-card.singles   { border-color: #0277bd; }

    .court-label {
      background: var(--court);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.92);
    }
    .court-card.remainder .court-label { background: var(--orange); }
    .court-card.singles   .court-label { background: #0277bd; }

    .rem-badge {
      background: rgba(255,255,255,0.2);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.68rem;
    }

    .court-body { display: flex; align-items: stretch; }

    .net {
      width: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--surface2);
      flex-shrink: 0; gap: 3px; padding: 8px 0;
    }
    .net-dot  { width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
    .net-line { width: 2px; flex: 1; background: rgba(249,211,66,0.2); max-height: 14px; }
    .vs-text  {
      font-size: 0.55rem; font-weight: 800; color: var(--accent);
      writing-mode: vertical-lr; letter-spacing: 2px; opacity: 0.9;
    }

    /* ── Team ── */
    .team {
      flex: 1; padding: 8px;
      display: flex; flex-direction: column; gap: 4px; min-width: 0;
    }
    .team-controls { display: flex; justify-content: flex-end; margin-bottom: 1px; }

    .lock-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 8px;
      border: 1px solid var(--surface2); border-radius: 6px;
      background: none; color: var(--muted);
      font-size: 0.68rem; font-weight: 600; cursor: pointer;
      transition: all 0.18s;
    }
    .lock-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .lock-btn.locked { border-color: var(--gold); color: var(--gold); background: rgba(255,193,7,0.1); }
    .lock-btn.prelock { border-color: var(--gold); color: var(--gold); background: rgba(255,193,7,0.07); cursor: default; opacity: 0.8; }

    /* ── Player card ── */
    .player-card {
      border: none;
      border-left: 3px solid transparent;
      border-radius: 8px;
      padding: 7px 9px;
      display: flex; align-items: center; gap: 8px;
      cursor: grab;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, opacity 0.15s, box-shadow 0.15s;
      user-select: none; min-width: 0;
    }
    /* white sheen on hover, works regardless of card colour */
    .player-card::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      border-radius: inherit;
      transition: background 0.15s;
      pointer-events: none;
    }
    .player-card:hover::after { background: rgba(255,255,255,0.07); }
    /* locked: gold ring via box-shadow so it layers over the card colour */
    .player-card.locked { box-shadow: inset 0 0 0 1.5px var(--gold); }
    .player-card.locked:hover::after { background: rgba(255,193,7,0.09); }
    .player-card.dragging { opacity: 0.2; transform: scale(0.96); }
    .player-card.drag-over {
      box-shadow: inset 0 0 0 2px var(--accent) !important;
      background: rgba(249,211,66,0.13) !important;
      transform: scale(1.03);
    }
    .player-card:active { cursor: grabbing; }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 800; color: #fff;
      flex-shrink: 0; text-transform: uppercase;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .player-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lock-icon   { margin-left: auto; font-size: 0.65rem; opacity: 0.8; flex-shrink: 0; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--surface3); border-radius: 8px;
      padding: 9px; color: var(--muted); font-size: 0.73rem;
      text-align: center; min-height: 40px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: rgba(249,211,66,0.07); color: var(--accent); }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state .ball { font-size: 3.5rem; margin-bottom: 14px; }
    .empty-state h3    { font-size: 1.15rem; color: var(--text); margin-bottom: 8px; }
    .empty-state p     { font-size: 0.85rem; line-height: 1.6; max-width: 340px; }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      html, body { overflow: auto; height: auto; }
      .app-body  { flex-direction: column; overflow: visible; }
      .sidebar   { width: 100%; border-right: none; border-bottom: 1px solid var(--surface2); }
      .sidebar-inner { padding-bottom: 16px; }
      .main-content  { grid-template-columns: 1fr; overflow: visible; }
      .empty-state   { grid-column: 1; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <span class="header-logo">🎾</span>
  <div>
    <h1>Tennis Practice Planner</h1>
    <p>Two rounds of doubles · drag-and-drop · lock pairs</p>
  </div>
</div>

<!-- ── App body ── -->
<div class="app-body">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-inner">

      <!-- Players -->
      <div>
        <div class="section-label">
          Players <span id="count-pill" class="count-pill" style="display:none">0</span>
        </div>
        <textarea id="names-input"
          oninput="onNamesInput()"
          placeholder="One per line or comma-separated:&#10;Alice, Bob, Charlie&#10;Diana, Eve, Frank&#10;Grace, Henry"></textarea>
      </div>

      <!-- Pre-lock -->
      <div class="prelock-section" id="prelock-section" style="display:none">
        <div class="prelock-header" onclick="togglePrelock()">
          <span class="prelock-title">🔒 Pre-lock Pairs</span>
          <span class="prelock-badge" id="prelock-badge">Click a player to start</span>
          <span class="prelock-chevron open" id="prelock-chevron">▼</span>
        </div>
        <div class="prelock-body" id="prelock-body">
          <div class="pool-label">Available players</div>
          <div class="player-pool" id="player-pool"></div>
          <div id="pending-prompt" style="display:none" class="pending-prompt"></div>
          <div id="locked-pairs"   style="display:none" class="locked-pairs"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="sidebar-actions">
        <button class="btn btn-primary" onclick="generatePairings()">⚡ Generate Rounds</button>
        <button class="btn btn-ghost"   onclick="copySchedule()">Copy Schedule</button>
        <button class="btn btn-ghost"   onclick="clearAll()">Clear</button>
      </div>

    </div>
  </aside>

  <!-- ── Main: rounds ── -->
  <main class="main-content" id="main-content">
    <div class="empty-state">
      <div class="ball">🎾</div>
      <h3>Ready to plan your practice?</h3>
      <p>Add player names on the left, optionally pre-lock pairs, then hit <strong>Generate Rounds</strong>.</p>
    </div>
  </main>

</div><!-- end app-body -->

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let state = {
  players:     [],
  preLocked:   [],      // [[a,b], ...]
  pendingLock: null,
  prelockOpen: true,
  rounds: [{ courts: [] }, { courts: [] }]
};
let dragState = null;

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function parseNames(input) {
  return input.split(/[\n,;]+/).map(n => n.trim()).filter(Boolean);
}
function initials(name) {
  const p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}
const COLORS = [
  '#42a5f5', // sky blue
  '#ba68c8', // lavender
  '#4db6ac', // teal
  '#ff7043', // coral
  '#7986cb', // periwinkle
  '#f06292', // rose
  '#4dd0e1', // cyan
  '#aed581', // lime green
  '#ffa726', // amber
  '#90a4ae', // steel blue
  '#ef5350', // red
  '#66bb6a', // green
];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}

// ─────────────────────────────────────────────
// Pre-lock
// ─────────────────────────────────────────────
function onNamesInput() {
  const names = parseNames(document.getElementById('names-input').value);
  const set = new Set(names);
  state.preLocked   = state.preLocked.filter(([a,b]) => set.has(a) && set.has(b));
  if (state.pendingLock && !set.has(state.pendingLock)) state.pendingLock = null;
  const pill = document.getElementById('count-pill');
  if (names.length) { pill.textContent = names.length; pill.style.display = 'inline-block'; }
  else pill.style.display = 'none';
  renderPrelock(names);
}

function togglePrelock() {
  state.prelockOpen = !state.prelockOpen;
  document.getElementById('prelock-body').style.display = state.prelockOpen ? 'block' : 'none';
  document.getElementById('prelock-chevron').classList.toggle('open', state.prelockOpen);
}

function renderPrelock(names) {
  const section = document.getElementById('prelock-section');
  if (!names || names.length < 2) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('prelock-body').style.display = state.prelockOpen ? 'block' : 'none';
  document.getElementById('prelock-chevron').classList.toggle('open', state.prelockOpen);

  const lockedSet = new Set(state.preLocked.flat());
  const available = names.filter(n => !lockedSet.has(n));

  // Pool
  const pool = document.getElementById('player-pool');
  pool.innerHTML = available.length === 0
    ? '<span class="pool-empty">All players paired.</span>'
    : available.map(name => {
        const c = avatarColor(name);
        const sel = state.pendingLock === name;
        return `<span class="pool-chip${sel ? ' selected' : ''}"
              style="border-color:${c}${sel?'':'66'}; background:${c}${sel?'22':'10'};"
              onclick="selectForLock('${CSS.escape(name)}')">
          <span class="chip-av" style="background:${c}">${initials(name)}</span>
          ${name}
        </span>`;
      }).join('');

  // Pending
  const prompt = document.getElementById('pending-prompt');
  if (state.pendingLock) {
    prompt.style.display = 'block';
    prompt.innerHTML = `<strong>${state.pendingLock}</strong> selected — pick a partner, or click again to deselect.`;
  } else {
    prompt.style.display = 'none';
  }

  // Locked list
  const pairsEl = document.getElementById('locked-pairs');
  if (!state.preLocked.length) {
    pairsEl.style.display = 'none';
  } else {
    pairsEl.style.display = 'block';
    pairsEl.innerHTML = `
      <div class="pool-label" style="margin-bottom:7px">Locked pairs</div>
      ${state.preLocked.map(([a,b], i) => `
        <div class="locked-pair-row">
          <span class="pair-chip">
            <span class="chip-av" style="background:${avatarColor(a)}">${initials(a)}</span>${a}
          </span>
          <span class="pair-link">🔒</span>
          <span class="pair-chip">
            <span class="chip-av" style="background:${avatarColor(b)}">${initials(b)}</span>${b}
          </span>
          <button class="remove-btn" onclick="removeLock(${i})">✕</button>
        </div>`).join('')}`;
  }

  // Badge
  const badge = document.getElementById('prelock-badge');
  badge.textContent = state.preLocked.length
    ? `${state.preLocked.length} pair${state.preLocked.length > 1 ? 's' : ''} locked`
    : state.pendingLock ? 'Pick a partner…' : 'Click a player to start';
}

function selectForLock(name) {
  if (!state.pendingLock) {
    state.pendingLock = name;
  } else if (state.pendingLock === name) {
    state.pendingLock = null;
  } else {
    state.preLocked.push([state.pendingLock, name]);
    state.pendingLock = null;
  }
  renderPrelock(parseNames(document.getElementById('names-input').value));
}

function removeLock(idx) {
  state.preLocked.splice(idx, 1);
  renderPrelock(parseNames(document.getElementById('names-input').value));
}

// ─────────────────────────────────────────────
// Round generation
// ─────────────────────────────────────────────
function makeRound1(players) {
  const lockedSet = new Set(state.preLocked.flat());
  const freeP     = shuffle(players.filter(p => !lockedSet.has(p)));

  // Build locked-pair teams and free-player teams
  const lockedTeams = shuffle([...state.preLocked]).map(p => ({ players: [...p], locked: true }));
  const freePairs   = [];
  for (let i = 0; i + 1 < freeP.length; i += 2)
    freePairs.push({ players: [freeP[i], freeP[i + 1]], locked: false });
  const oddFree = freeP.length % 2 === 1 ? freeP[freeP.length - 1] : null;

  let allTeams = [...lockedTeams, ...freePairs];
  let extraCourt = null;

  // Odd team count → pull a free pair out and make it a singles court (1v1).
  // If no free pairs, fall back to a remainder court.
  if (allTeams.length % 2 !== 0) {
    const freeIdx = allTeams.map((t, i) => ({ t, i })).reverse().find(({ t }) => !t.locked)?.i;
    if (freeIdx !== undefined) {
      const [sp] = allTeams.splice(freeIdx, 1);
      extraCourt = {
        teams: [{ players: [sp.players[0]], locked: false }, { players: [sp.players[1]], locked: false }],
        isRemainder: false, isSingles: true
      };
    } else {
      const last = allTeams.pop();
      extraCourt = { teams: [last, { players: [], locked: false }], isRemainder: true, isSingles: false };
    }
  }

  const st = shuffle(allTeams);
  const courts = [];
  for (let i = 0; i < st.length; i += 2)
    courts.push({ teams: [st[i], st[i + 1]], isRemainder: false, isSingles: false });

  // Lone individual (odd total free players) → remainder
  if (oddFree !== null)
    courts.push({ teams: [{ players: [oddFree], locked: false }, { players: [], locked: false }], isRemainder: true, isSingles: false });

  if (extraCourt) courts.push(extraCourt);
  return { courts };
}

function makeRound2(round1) {
  const locked   = [];
  const unlocked = [];
  round1.courts.forEach((c, ci) =>
    c.teams.forEach((t, ti) =>
      t.locked ? locked.push({ ci, ti, players: [...t.players] }) : unlocked.push(...t.players)
    )
  );
  const n = unlocked.length, half = Math.floor(n/2);
  const rotated = [];
  for (let i = 0; i < half; i++) { rotated.push(unlocked[i]); rotated.push(unlocked[i+half]); }
  if (n % 2) rotated.push(unlocked[n-1]);

  if (!locked.length) return { courts: buildCourtsFromPlayers(rotated) };

  const r2 = round1.courts.map(c => ({
    isRemainder: c.isRemainder,
    teams: c.teams.map(t => t.locked ? { players: [...t.players], locked: true } : null)
  }));
  let ui = 0;
  r2.forEach((c, ci) =>
    c.teams.forEach((t, ti) => {
      if (t === null) {
        const size = round1.courts[ci].teams[ti].players.length;
        const pl = [];
        for (let k = 0; k < size && ui < rotated.length; k++) pl.push(rotated[ui++]);
        r2[ci].teams[ti] = { players: pl, locked: false };
      }
    })
  );
  return { courts: r2 };
}

function buildCourtsFromPlayers(players) {
  const courts = [];
  let i = 0;
  while (i + 4 <= players.length) {
    courts.push({
      teams: [
        { players: [players[i],   players[i+1]], locked: false },
        { players: [players[i+2], players[i+3]], locked: false }
      ],
      isRemainder: false
    });
    i += 4;
  }
  if (i < players.length) {
    const rem = players.slice(i), mid = Math.ceil(rem.length/2);
    const isSingles = rem.length === 2;
    courts.push({
      teams: [{ players: rem.slice(0,mid), locked: false }, { players: rem.slice(mid), locked: false }],
      isRemainder: !isSingles,
      isSingles
    });
  }
  return courts;
}

// ─────────────────────────────────────────────
// Actions
// ─────────────────────────────────────────────
function generatePairings() {
  const names = parseNames(document.getElementById('names-input').value);
  if (names.length < 2) { alert('Enter at least 2 player names.'); return; }
  state.players    = names;
  state.rounds[0]  = makeRound1(names);
  state.rounds[1]  = makeRound2(state.rounds[0]);
  renderMain();
}
function reshuffleRound2() {
  if (!state.players.length) return;
  state.rounds[1] = makeRound2(state.rounds[0]);
  renderMain();
}
function shuffleRound1() {
  if (!state.players.length) return;
  state.rounds[0] = makeRound1(state.players);
  state.rounds[1] = makeRound2(state.rounds[0]);
  renderMain();
}
function toggleLock(ri, ci, ti) {
  const team = state.rounds[ri].courts[ci].teams[ti];
  if (team.isPreLock) return;
  team.locked = !team.locked;
  if (ri === 0) state.rounds[1] = makeRound2(state.rounds[0]);
  renderMain();
}
function clearAll() {
  state = { players: [], preLocked: [], pendingLock: null, prelockOpen: true, rounds: [{ courts: [] }, { courts: [] }] };
  document.getElementById('names-input').value = '';
  document.getElementById('count-pill').style.display = 'none';
  document.getElementById('prelock-section').style.display = 'none';
  renderMain();
}
function copySchedule() {
  if (!state.rounds[0].courts.length) { alert('Generate rounds first.'); return; }
  let out = '=== Tennis Practice Schedule ===\n\n';
  state.rounds.forEach((round, ri) => {
    out += `── Round ${ri+1} ──\n`;
    round.courts.forEach((c, ci) => {
      const lbl = c.isRemainder ? 'Remainder' : `Court ${ci+1}`;
      out += `  ${lbl}: ${c.teams[0].players.join(' & ')||'(empty)'}  vs  ${c.teams[1].players.join(' & ')||'(empty)'}\n`;
    });
    out += '\n';
  });
  navigator.clipboard.writeText(out).then(() => alert('Copied!'), () => alert('Copy failed.'));
}

// ─────────────────────────────────────────────
// Drag & Drop
// ─────────────────────────────────────────────
function onDragStart(e, ri, ci, ti, pi) {
  const team = state.rounds[ri].courts[ci].teams[ti];
  dragState = { ri, ci, ti, pi, teamDrag: team.locked };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  setTimeout(() => {
    if (team.locked) {
      // Fade the whole team so it's clear both players are moving
      team.players.forEach((_, idx) => {
        document.querySelector(`[data-did="${ri}-${ci}-${ti}-${idx}"]`)?.classList.add('dragging');
      });
    } else {
      document.querySelector(`[data-did="${ri}-${ci}-${ti}-${pi}"]`)?.classList.add('dragging');
    }
  }, 0);
}
function onDragEnd() {
  document.querySelectorAll('.player-card,.drop-zone').forEach(el => el.classList.remove('dragging','drag-over'));
  dragState = null;
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDragEnter(e, ri, ci, ti, pi) {
  e.preventDefault();
  if (!dragState || dragState.ri !== ri) return;
  const key = pi === 'empty' ? `empty-${ri}-${ci}-${ti}` : `${ri}-${ci}-${ti}-${pi}`;
  document.querySelector(`[data-did="${key}"]`)?.classList.add('drag-over');
}
function onDragLeave(e, ri, ci, ti, pi) {
  const key = pi === 'empty' ? `empty-${ri}-${ci}-${ti}` : `${ri}-${ci}-${ti}-${pi}`;
  const el = document.querySelector(`[data-did="${key}"]`);
  if (el && !el.contains(e.relatedTarget)) el.classList.remove('drag-over');
}
function onDrop(e, ri, ci, ti, pi) {
  e.preventDefault(); e.stopPropagation();
  const key = pi === 'empty' ? `empty-${ri}-${ci}-${ti}` : `${ri}-${ci}-${ti}-${pi}`;
  document.querySelector(`[data-did="${key}"]`)?.classList.remove('drag-over');
  if (!dragState || dragState.ri !== ri) { dragState = null; return; }

  const src = dragState;
  const sTeam = state.rounds[src.ri].courts[src.ci].teams[src.ti];
  const tTeam = state.rounds[ri].courts[ci].teams[ti];
  // Same slot — no-op
  if (src.ci===ci && src.ti===ti && src.pi===pi) { dragState=null; return; }

  if (sTeam.locked || tTeam.locked) {
    // At least one side is a locked pair → swap entire teams so the pair stays intact
    if (src.ci===ci && src.ti===ti) { dragState=null; return; } // same team
    [sTeam.players, tTeam.players] = [tTeam.players, sTeam.players];
    [sTeam.locked,  tTeam.locked]  = [tTeam.locked,  sTeam.locked];
  } else if (pi === 'empty') {
    tTeam.players.push(sTeam.players.splice(src.pi, 1)[0]);
  } else {
    [sTeam.players[src.pi], tTeam.players[pi]] = [tTeam.players[pi], sTeam.players[src.pi]];
  }
  dragState = null;
  renderMain();
}

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById('main-content');
  if (!state.rounds[0].courts.length) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="ball">🎾</div>
        <h3>Ready to plan your practice?</h3>
        <p>Add player names on the left, optionally pre-lock pairs, then hit <strong>Generate Rounds</strong>.</p>
      </div>`;
    return;
  }
  main.innerHTML = renderRound(0) + renderRound(1);
}

function renderRound(ri) {
  const round  = state.rounds[ri];
  const full      = round.courts.filter(c => !c.isRemainder && !c.isSingles).length;
  const hasSingles = round.courts.some(c => c.isSingles);
  const hasRem    = round.courts.some(c => c.isRemainder);
  return `
    <div class="round-col">
      <div class="round-header">
        <span>
          <span class="round-title">Round ${ri+1}</span>
          <span class="round-meta">${full} court${full!==1?'s':''}${hasSingles?' + singles':''}${hasRem?' + rem':''}</span>
        </span>
        <button class="btn-sm" onclick="${ri===0?'shuffleRound1':'reshuffleRound2'}()">↺ Reshuffle</button>
      </div>
      ${round.courts.map((c, ci) => renderCourt(ri, ci, c)).join('')}
    </div>`;
}

function renderCourt(ri, ci, court) {
  const cls   = court.isSingles ? ' singles' : court.isRemainder ? ' remainder' : '';
  const label = court.isSingles ? '🎾 Singles Court'
              : court.isRemainder ? '⚠ Remainder'
              : `Court ${ci+1}`;
  const badge = court.isSingles ? '<span class="rem-badge">1 v 1</span>'
              : court.isRemainder ? '<span class="rem-badge">rotate or rally</span>'
              : '';
  return `
    <div class="court-card${cls}">
      <div class="court-label">
        <span>${label}</span>
        ${badge}
      </div>
      <div class="court-body">
        ${renderTeam(ri, ci, 0, court.teams[0])}
        <div class="net">
          <div class="net-dot"></div><div class="net-line"></div>
          <span class="vs-text">VS</span>
          <div class="net-line"></div><div class="net-dot"></div>
        </div>
        ${renderTeam(ri, ci, 1, court.teams[1])}
      </div>
    </div>`;
}

function renderTeam(ri, ci, ti, team) {
  const locked = team.locked;
  const isPreLock = locked && state.preLocked.some(
    ([a,b]) => team.players.includes(a) && team.players.includes(b)
  );
  const lockBtn = isPreLock
    ? `<span class="lock-btn prelock">🔒 Pre-locked</span>`
    : `<button class="lock-btn${locked?' locked':''}" onclick="toggleLock(${ri},${ci},${ti})">
         ${locked ? '🔒 Locked' : '🔓 Lock'}
       </button>`;
  return `
    <div class="team">
      <div class="team-controls">${lockBtn}</div>
      ${team.players.map((p,pi) => renderPlayer(ri, ci, ti, pi, p, locked)).join('')}
      ${!locked && !team.players.length ? renderDropZone(ri, ci, ti) : ''}
    </div>`;
}

function renderPlayer(ri, ci, ti, pi, name, locked) {
  const did   = `${ri}-${ci}-${ti}-${pi}`;
  const color = avatarColor(name);
  // Gradient fades from the player's colour on the left to transparent — whole card is tinted
  const cardStyle = `background: linear-gradient(105deg, ${color}32 0%, ${color}0d 55%, transparent 100%); border-left-color: ${color};`;
  return `
    <div class="player-card${locked?' locked':''}"
         style="${cardStyle}"
         data-did="${did}" draggable="true"
         ondragstart="onDragStart(event,${ri},${ci},${ti},${pi})"
         ondragend="onDragEnd()"
         ondragover="onDragOver(event)"
         ondragenter="onDragEnter(event,${ri},${ci},${ti},${pi})"
         ondragleave="onDragLeave(event,${ri},${ci},${ti},${pi})"
         ondrop="onDrop(event,${ri},${ci},${ti},${pi})">
      <div class="avatar" style="background:${color}">${initials(name)}</div>
      <span class="player-name">${name}</span>
      ${locked ? '<span class="lock-icon">🔒</span>' : ''}
    </div>`;
}

function renderDropZone(ri, ci, ti) {
  const did = `empty-${ri}-${ci}-${ti}`;
  return `
    <div class="drop-zone" data-did="${did}"
         ondragover="onDragOver(event)"
         ondragenter="onDragEnter(event,${ri},${ci},${ti},'empty')"
         ondragleave="onDragLeave(event,${ri},${ci},${ti},'empty')"
         ondrop="onDrop(event,${ri},${ci},${ti},'empty')">Drop here</div>`;
}
</script>
